# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        # our C and C++ only: the vendored upstream files in src/xbr keep their own style; re_* are generated
        files: ^src/(fci_[^/]*\.(c|h)|kinit/.*\.c|xbr/fci_[^/]*\.(cpp|h))$
  - repo: local
    hooks:
      - id: no-game-files
        name: no game files or large files
        entry: python -B tools/repo_check.py
        language: system
        pass_filenames: true
